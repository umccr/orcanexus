spring:
  config:
    activate:
      on-profile: mockdb

  devtools:
    restart:
      enabled: true
      exclude:
        - static/**
        - public/**
        - templates/**

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${MOCKDB_HOST:127.0.0.1}:${MOCKDB_PORT:5433}/${MOCKDB_NAME:orcanexus}
    username: ${MOCKDB_USER:orcanexus}
    password: ${MOCKDB_PASSWORD:mockdb-local-only} # pragma: allowlist secret
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 10000
      validation-timeout: 5000

  # Fail startup when the database is unreachable or rejects the credentials.
  sql:
    init:
      mode: always
      schema-locations: classpath:mockdb/startup-check.sql

management:
  endpoints:
    web:
      exposure:
        include:
          - info
          - health
          - metrics
          - loggers
          - env
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# ---

orcanexus:
  system:
    environment: mockdb

spring.data.web.pageable:
  default-page-size: ${PAGE_DEFAULT_SIZE:10}
  max-page-size: ${PAGE_MAX_SIZE:10000}
