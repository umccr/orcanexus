spring:
  application:
    name: orcanexus

  profiles:
    default: local

  jooq:
    sql-dialect: POSTGRES

  mvc:
    # Render MVC errors (including ResponseStatusException) as RFC 9457 problem details
    problemdetails:
      enabled: true

  datasource:
    driver-class-name: software.amazon.jdbc.Driver
    url: "jdbc:aws-wrapper:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?wrapperPlugins=iam&iamHost=${DB_HOST}&iamPort=${DB_PORT:5432}&iamRegion=${AWS_REGION:ap-southeast-2}&iamUsername=${DB_USER}&sslmode=require"
    username: ${DB_USER}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 10000
      validation-timeout: 5000
      max-lifetime: 600000
      idle-timeout: 300000

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.jooq: INFO

# ---

info:
  app:
    name: ${spring.application.name}
    description: OrcaNexus Data API
    version: ${project.version:unknown}

springdoc:
  show-actuator: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: when_authorized

# ---

orcanexus:
  system:
    name: ${info.app.name}
    description: ${info.app.description}
    environment: ${SPRING_PROFILES_ACTIVE:unknown}
  datasource:
    # Rewrites generated jOOQ schema names to their physical database names at query-render time,
    # so the generated model can be reused when the database schema is named differently.
    # Add/adjust entries as the physical schema naming changes; no code changes required.
    schema-mappings:
      - input: ${DB_SCHEMA_INPUT:mart}
        output: ${DB_SCHEMA_OUTPUT:mart}

# Spring Data web support (Pageable resolution and request validation limits)
spring.data.web.pageable:
  default-page-size: ${PAGE_DEFAULT_SIZE:10}
  max-page-size: ${PAGE_MAX_SIZE:1000}
