repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^(yarn.lock|.yarn/)
      - id: check-json
      - id: check-yaml
      - id: detect-aws-credentials
        args: [ --allow-missing-credentials ]
      - id: detect-private-key
#      - id: end-of-file-fixer
#      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: [ --branch, main, --branch, master, --pattern, release/.* ]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect secrets
        args: [ '--baseline', '.secrets.baseline' ]
        exclude: ^(.idea/|.local/|.terraform/|terraform.tfstate.d/|target/|logs/)|package-lock.yml|pnpm-lock.yaml

  - repo: local
    hooks:
      - id: spotless-check
        name: check Java formatting
        entry: mvn -B spotless:check
        language: system
        pass_filenames: false
        files: \.java$

#      - id: checkstyle
#        name: Run Checkstyle
#        entry: mvn -B checkstyle:check
#        language: system
#        pass_filenames: false
#        files: \.java$
